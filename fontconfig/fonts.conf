<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

<!-- 无衬线（sans-serif） -->
<alias>
  <family>sans-serif</family>
  <prefer>
    <family>Noto Sans CJK SC</family>
  </prefer>
</alias>

<!-- 衬线（serif） -->
<alias>
  <family>serif</family>
  <prefer>
    <family>Noto Sans CJK SC</family>
  </prefer>
</alias>

<!-- 等宽（monospace） -->
<alias>
  <family>monospace</family>
  <prefer>
    <family>Noto Sans Mono CJK SC</family>
  </prefer>
</alias>

</fontconfig>
